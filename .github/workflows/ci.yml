name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

# A new push to the same PR cancels the previous run; only the tip matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile` is the gate: a PR that edited package.json without
      # committing the regenerated lockfile fails here rather than resolving
      # some other version tree in CI than the one that was reviewed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # No Sanity vars are passed here. `src/sanity/env.ts` already defaults to
      # the public project/dataset, and passing `${{ vars.* }}` was actively
      # harmful: an undefined repository variable interpolates to the empty
      # string, which is *defined*, so the `??` fallback never fires and the
      # build dies with "Configuration must contain `projectId`".
      - name: Build
        run: pnpm build
