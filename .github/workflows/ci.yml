name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

# A new push to the same PR cancels the previous run; only the tip matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only for `SANITY_API_READ_TOKEN`, which lives in this environment's
    # secrets. Keep "Production" free of required reviewers: an approval gate
    # here would park every CI run until someone clicks it.
    environment: Production

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # `--frozen-lockfile` is the gate: a PR that edited package.json without
      # committing the regenerated lockfile fails here rather than resolving
      # some other version tree in CI than the one that was reviewed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The read token is not optional. This Sanity project returns an empty
      # result set to unauthenticated callers, so without it `getSiteSettings`
      # finds no document and throws during prerender, which fails the build on
      # whichever route Next happens to reach first.
      #
      # The project/dataset vars stay unpassed on purpose. `src/cms/sanity/env.ts`
      # already defaults to the public values, and wiring `${{ vars.* }}` in was
      # actively harmful: an undefined repository variable interpolates to the
      # empty string, which is *defined*, so the `??` fallback never fires and
      # the build dies with "Configuration must contain `projectId`".
      - name: Build
        run: pnpm build
        env:
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          SANITY_REVALIDATE_SECRET: ${{ secrets.SANITY_REVALIDATE_SECRET }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
