name: Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    # Weekly, so a dependency that turns vulnerable *after* it was merged still
    # surfaces. PR-only scanning never catches those.
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks diffs the whole history, not just the tip commit — a
          # secret added and "removed" in a later commit is still leaked.
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails the PR on high/critical only. Moderate advisories in transitive
      # dev deps would otherwise block every merge on something nobody can fix
      # that day; Dependabot picks those up instead.
      - name: Audit
        run: pnpm audit --audit-level high --prod

  trivy:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Only this job and CodeQL need it; the workflow default stays read-only.
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Reports rather than gates. `pnpm audit` above is the merge gate; this
      # reads the same pnpm-lock.yaml but files what it finds as tracked alerts
      # in the Security tab, where they survive the run instead of scrolling
      # past in a log. It also catches advisories the npm registry feed misses.
      #
      # Pinned to a SHA, not a tag or @master: a third-party action runs with
      # this repo's token, and a moving ref is a supply-chain hole.
      - name: Run Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          # Advisories with no released fix are noise on a PR — nobody can act
          # on them, and Dependabot re-raises them once a patch lands.
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif

      # `if: always()` so a scan that errors still uploads whatever it produced
      # rather than silently reporting nothing.
      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
